services:
  backend:
    build: ./RAG_Backend
    container_name: backend
    ports:
      - "5000:5000"
    # Ensure your .env variables are loaded or defined here if needed
    env_file:
      - ./RAG_Backend/.env

  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      # Mounts the proxy config to overwrite Nginx's default
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend