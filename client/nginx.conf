server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /chat requests to the FastAPI backend container
    location /chat {
        proxy_pass http://backend:5000/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # CRITICAL: Turn off buffering so the LLM tokens stream in real-time
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Proxy /health requests to the backend
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve the React frontend for all other requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}